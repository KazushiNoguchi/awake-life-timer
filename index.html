<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f2ed">
    <meta name="description" content="起床してからの経過時間を基準に、一日の予定を確認するタイマー">
    <title>Awake</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="awake-heading">
        <div class="hero-topline">
          <p class="eyebrow" id="awake-heading">AWAKE</p>
          <div class="hero-status">
            <span class="sync-status" id="sync-status">この端末のみ</span>
            <time class="clock-time" id="clock-time" aria-label="現在時刻">--:--</time>
          </div>
        </div>

        <div id="inactive-view" class="inactive-view" hidden>
          <p class="inactive-copy">起きたら始める</p>
          <button class="primary-button wake-button" id="wake-button" type="button">起床</button>
        </div>

        <div id="active-view" class="active-view" hidden>
          <output class="timer" id="timer" aria-live="off">00:00:00</output>

          <div class="current-block">
            <p class="section-label">NOW</p>
            <p class="current-label" id="current-label">予定なし</p>
            <p class="current-range" id="current-range">—</p>
            <p class="remaining" id="remaining">—</p>
            <div class="progress-track" id="progress-track" role="progressbar" aria-label="現在の予定の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="progress-fill" id="progress-fill"></span>
            </div>
          </div>

          <div class="next-block" aria-labelledby="next-heading">
            <p class="section-label" id="next-heading">NEXT</p>
            <p class="next-content" id="next-content">予定なし</p>
          </div>
        </div>
      </section>

      <section class="schedule-section" id="schedule-section" aria-labelledby="today-heading">
        <div class="section-heading-row">
          <div>
            <p class="section-label" id="today-heading">TODAY</p>
            <h1>起床後の予定</h1>
          </div>
          <button class="text-button" id="open-settings" type="button" aria-haspopup="dialog">設定</button>
        </div>
        <ol class="schedule-list" id="schedule-list"></ol>
      </section>
    </main>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="dialog-header">
        <div>
          <p class="section-label">SETTINGS</p>
          <h2 id="settings-title">設定</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="設定を閉じる" type="submit">×</button>
      </form>

      <div class="dialog-body">
        <section class="settings-section" id="wake-settings">
          <div class="settings-heading">
            <h3>起床時刻</h3>
            <p id="wake-date-note">タイマー開始後に変更できます。</p>
          </div>
          <div class="wake-time-controls">
            <label class="field compact-field">
              <span>時刻</span>
              <input id="wake-time-input" type="time" step="60" disabled>
            </label>
            <button class="secondary-button" id="save-wake-time" type="button" disabled>変更</button>
          </div>
          <div class="adjust-buttons" aria-label="起床時刻の簡易調整">
            <button type="button" data-adjust="-30" disabled>−30分</button>
            <button type="button" data-adjust="-10" disabled>−10分</button>
            <button type="button" data-adjust="10" disabled>＋10分</button>
            <button type="button" data-adjust="30" disabled>＋30分</button>
          </div>
          <button class="danger-outline-button full-width" id="end-day-button" type="button" disabled>今日を終了</button>
        </section>

        <section class="settings-section" aria-labelledby="schedule-settings-title">
          <div class="settings-heading settings-heading-row">
            <div>
              <h3 id="schedule-settings-title">スケジュール</h3>
              <p>起床からの経過時間で入力します。</p>
            </div>
            <button class="secondary-button small-button" id="add-schedule" type="button">＋ 予定を追加</button>
          </div>
          <div id="schedule-errors" class="error-summary" role="alert" hidden></div>
          <div class="schedule-editor" id="schedule-editor"></div>
          <button class="primary-button full-width" id="save-schedule" type="button">スケジュールを保存</button>
        </section>

        <section class="settings-section" aria-labelledby="sync-settings-title">
          <div class="settings-heading">
            <h3 id="sync-settings-title">端末間同期</h3>
            <p id="sync-description">共有ルームを作ると、同じリンクを開いた端末へ変更が反映されます。</p>
          </div>
          <div class="sync-actions">
            <button class="primary-button full-width" id="create-sync-room" type="button">同期を開始</button>
            <button class="secondary-button full-width" id="copy-sync-link" type="button" hidden>共有リンクをコピー</button>
            <button class="danger-outline-button full-width" id="leave-sync-room" type="button" hidden>この端末の同期を解除</button>
          </div>
          <p class="sync-detail" id="sync-detail" aria-live="polite">現在、この端末内だけに保存されています。</p>
        </section>

        <section class="settings-section reset-section">
          <h3>データ初期化</h3>
          <p>起床時刻と編集したスケジュールを初期状態に戻します。</p>
          <button class="danger-outline-button full-width" id="reset-data" type="button">すべての設定を初期化</button>
        </section>
      </div>
    </dialog>

    <template id="schedule-row-template">
      <div class="schedule-editor-row">
        <label class="field time-field">
          <span>開始</span>
          <input class="start-input" type="text" inputmode="numeric" placeholder="0:00" aria-label="開始時間">
        </label>
        <span class="range-arrow" aria-hidden="true">→</span>
        <label class="field time-field">
          <span>終了</span>
          <input class="end-input" type="text" inputmode="numeric" placeholder="1:00" aria-label="終了時間">
        </label>
        <label class="field label-field">
          <span>内容</span>
          <input class="label-input" type="text" maxlength="40" placeholder="予定の内容" aria-label="予定の内容">
        </label>
        <button class="delete-button" type="button" aria-label="この予定を削除">削除</button>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
